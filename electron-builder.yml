appId: io.github.bosschaisit.xcell
productName: XCell
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# ไอคอนหน้าต่าง/ทาสก์บาร์ที่ main.ts โหลดตอนรัน (โฟลเดอร์ build/ ไม่ถูกแพ็กไปกับแอป)
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icons/256x256.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
fileAssociations:
  - ext: xlsx
    name: Excel Worksheet
    description: Microsoft Excel Worksheet
    role: Editor
  - ext: csv
    name: CSV Document
    description: Comma Separated Values
    role: Editor
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: XCell
  oneClick: false
  allowToChangeInstallationDirectory: true
