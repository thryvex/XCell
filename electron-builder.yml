appId: io.github.bosschaisit.xcell
productName: XCell
# เวอร์ชันมาจาก package.json ("version": "0.1.0") — electron-builder ไม่มีช่องเวอร์ชันในไฟล์นี้
# ที่เผยแพร่ตัวติดตั้ง (GitHub Releases ของ repo XCell)
publish:
  provider: github
  owner: bosschaisit
  repo: XCell
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
# ไอคอนหน้าต่าง/ทาสก์บาร์ที่ main.ts โหลดตอนรัน (โฟลเดอร์ build/ ไม่ถูกแพ็กไปกับแอป)
extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icons/256x256.png
    to: icon.png
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
mac:
  icon: build/icon.png
  # Windows ลงทะเบียน "เปิดด้วย" เองใน build/installer.nsh (ไม่ตั้งเป็นโปรแกรมเริ่มต้น)
  fileAssociations:
    - ext: xlsx
      name: Excel Worksheet
      description: Microsoft Excel Worksheet
      role: Editor
    - ext: csv
      name: CSV Document
      description: Comma Separated Values
      role: Editor
  target:
    - target: dmg
      arch:
        - x64
        - arm64
nsis:
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: XCell
  oneClick: false
  allowToChangeInstallationDirectory: true
