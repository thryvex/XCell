  <rect x="2" y="2" width="20" height="20" rx="3" fill="none" stroke="#34e38a" stroke-width="2" />
  <rect x="5" y="6" width="6" height="3" fill="#34e38a" />
  <rect x="13" y="6" width="6" height="3" fill="#34e38a" />
  <rect x="5" y="11" width="6" height="3" fill="#34e38a" fill-opacity="0.55" />
  <rect x="13" y="11" width="6" height="3" fill="#34e38a" fill-opacity="0.55" />
  <rect x="5" y="16" width="6" height="3" fill="#34e38a" fill-opacity="0.55" />
  <rect x="13" y="16" width="6" height="3" fill="#34e38a" fill-opacity="0.55" />
</svg>
