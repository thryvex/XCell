<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- XCell icon (master, 48–256 px): neon-green rounded frame with a 2 × 3 grid of rounded cells on a dark tile -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="52" fill="#0b1410" />
  <!-- glow layer -->
  <g opacity="0.55" filter="url(#glow)">
    <rect x="26" y="26" width="204" height="204" rx="36" fill="none" stroke="#34e38a" stroke-width="12" />
    <rect x="58" y="62" width="64" height="36" rx="8" fill="#34e38a" />
    <rect x="134" y="62" width="64" height="36" rx="8" fill="#34e38a" />
  </g>
  <!-- frame -->
  <rect x="26" y="26" width="204" height="204" rx="36" fill="none" stroke="#34e38a" stroke-width="12" />
  <!-- header row -->
  <rect x="58" y="62" width="64" height="36" rx="8" fill="#34e38a" />
  <rect x="134" y="62" width="64" height="36" rx="8" fill="#34e38a" />
  <!-- body rows -->
  <rect x="58" y="110" width="64" height="36" rx="8" fill="#34e38a" fill-opacity="0.5" />
  <rect x="134" y="110" width="64" height="36" rx="8" fill="#34e38a" fill-opacity="0.5" />
  <rect x="58" y="158" width="64" height="36" rx="8" fill="#34e38a" fill-opacity="0.5" />
  <rect x="134" y="158" width="64" height="36" rx="8" fill="#34e38a" fill-opacity="0.5" />
</svg>
